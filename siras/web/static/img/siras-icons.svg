<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  SIRAS — Sistema de ícones autorais
  ============================================================================
  Regras da família (obrigatórias para qualquer ícone novo):
  1. Grade de 24×24, área útil 20×20 (margem óptica de 2px em todos os lados).
  2. Traço de 1.75, stroke-linecap="round", stroke-linejoin="round".
  3. fill="none" + stroke="currentColor" — a cor vem sempre do contexto.
  4. ASSINATURA DA FAMÍLIA: todo ícone contém pelo menos uma "onda de
     horizonte" — a curva em S dupla que existe no símbolo da marca. É ela que
     diferencia este conjunto de qualquer biblioteca genérica. Curva canônica:
     c 2,-1.4  3.6,1.4  5.6,0  s 3.6,1.4  5.6,0
  5. Nenhum ícone usa preenchimento sólido, exceto pontos de 1px de raio.
  ============================================================================
-->

